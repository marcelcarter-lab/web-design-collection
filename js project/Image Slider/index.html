<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <title>Image Slider</title>
</head>
<body>
    <div class="slider-container">
        <div id="slide-number" class="slide-number">Slide #6</div>
        <img class="active" src="Image/gallery-01.png" alt="image">
        <img src="Image/gallery-02.png" alt="image">
        <img src="Image/gallery-03.jpeg" alt="image">
        <img src="Image/gallery-04.png" alt="image">
        <img src="Image/gallery-05.jpeg" alt="image">
    </div>
    <div class="slider-controls">
        <span id="prev" class="prev">Previous</span>
        <span id="indicators" class="indicators">
            <ul>
                <li class="active">1</li>
                <li>2</li>
                <li>3</li>
                <li>4</li>
                <li>5</li>
            </ul>
        </span>
        <span id="next" class="next">Next</span>
    </div>

    <script src="main.js"></script>
</body>
</html>
