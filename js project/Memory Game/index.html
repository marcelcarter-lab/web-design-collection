<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="Image/logo.jpeg">
    <!-- normalize all elements -->
    <link rel="stylesheet" href="CSS/normalize.css" />
    <!-- link font awsome -->
    <link rel="stylesheet" href="CSS/all.min.css" />
    <!-- the main css fill -->
    <link rel="stylesheet" href="CSS/main.css" />
    <!-- select font  -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&family=Lobster+Two:wght@700&family=Open+Sans:wght@400;700&family=Work+Sans:wght@200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Memory Game</title>
  </head>
  <body>
    <!-- start header -->
    <div class="header">
      <div class="container">
        <div class="title">
          <div class="name">Hello:</div>
          <div class="tries">
            Wrong Tries:
            <div class="score">0</div>
          </div>
        </div>
      </div>
    </div>
    <!-- end header -->
    <!-- start splash screen  -->
    <!-- <div class="screen">
      <div class="con">
        <button class="button" onclick="start()">Start Game</button>
      </div>
    </div> -->
    <!-- end splash screen  -->
    <!-- start carts -->
    <div class="carts">
      <div class="container">
        <div class="block-game">
          <div class="content " data-pro="python">
            <div class="face front">?</div>
            <div class="face back" style="color: #0066ff">
              <i class="fa-brands fa-python"></i>
            </div>
          </div>
          <div class="content" data-pro="html5">
            <div class="face front">?</div>
            <div class="face back" style="color: #ff3622">
              <i class="fa-brands fa-html5"></i>
            </div>
          </div>
          <div class="content" data-pro="css3">
            <div class="face front">?</div>
            <div class="face back" style="color: #0349f4">
              <i class="fa-brands fa-css3-alt"></i>
            </div>
          </div>
          <div class="content" data-pro="js">
            <div class="face front">?</div>
            <div class="face back" style="color: orange">
              <i class="fa-brands fa-js"></i>
            </div>
          </div>
          <div class="content" data-pro="react">
            <div class="face front">?</div>
            <div class="face back" style="color: #4300fffa">
              <i class="fa-brands fa-react"></i>
            </div>
          </div>
          <div class="content" data-pro="vuejs">
            <div class="face front">?</div>
            <div class="face back" style="color: #00ff0acf">
              <i class="fa-brands fa-vuejs"></i>
            </div>
          </div>
          <div class="content" data-pro="github">
            <div class="face front">?</div>
            <div class="face back" style="color: dimgrey">
              <i class="fa-brands fa-github"></i>
            </div>
          </div>
          <div class="content" data-pro="branch">
            <div class="face front">?</div>
            <div class="face back" style="color: turquoise">
              <i class="fa-solid fa-code-branch"></i>
            </div>
          </div>
          <div class="content" data-pro="angular">
            <div class="face front">?</div>
            <div class="face back" style="color: #e91e63">
              <i class="fa-brands fa-angular"></i>
            </div>
          </div>
          <div class="content" data-pro="node">
            <div class="face front">?</div>
            <div class="face back" style="color: #6c1818">
              <i class="fa-brands fa-node"></i>
            </div>
          </div>
          <div class="content" data-pro="python">
            <div class="face front">?</div>
            <div class="face back" style="color: #0066ff">
              <i class="fa-brands fa-python"></i>
            </div>
          </div>
          <div class="content" data-pro="html5">
            <div class="face front">?</div>
            <div class="face back" style="color: #ff3622">
              <i class="fa-brands fa-html5"></i>
            </div>
          </div>
          <div class="content" data-pro="css3">
            <div class="face front">?</div>
            <div class="face back" style="color: #0349f4">
              <i class="fa-brands fa-css3-alt"></i>
            </div>
          </div>
          <div class="content" data-pro="js">
            <div class="face front">?</div>
            <div class="face back" style="color: orange">
              <i class="fa-brands fa-js"></i>
            </div>
          </div>
          <div class="content" data-pro="react">
            <div class="face front">?</div>
            <div class="face back" style="color: #4300fffa">
              <i class="fa-brands fa-react"></i>
            </div>
          </div>
          <div class="content" data-pro="vuejs">
            <div class="face front">?</div>
            <div class="face back" style="color: #00ff0acf">
              <i class="fa-brands fa-vuejs"></i>
            </div>
          </div>
          <div class="content" data-pro="github">
            <div class="face front">?</div>
            <div class="face back" style="color: dimgrey">
              <i class="fa-brands fa-github"></i>
            </div>
          </div>
          <div class="content" data-pro="branch">
            <div class="face front">?</div>
            <div class="face back" style="color: turquoise">
              <i class="fa-solid fa-code-branch"></i>
            </div>
          </div>
          <div class="content" data-pro="angular">
            <div class="face front">?</div>
            <div class="face back" style="color: #e91e63">
              <i class="fa-brands fa-angular"></i>
            </div>
          </div>
          <div class="content" data-pro="node">
            <div class="face front">?</div>
            <div class="face back" style="color: #6c1818">
              <i class="fa-brands fa-node"></i>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- end carts -->
    <audio id="success" src="audios/success-sound-effect.mp3" preload="auto"></audio>
    <audio id="fail" src="audios/negative_beeps-6008.mp3" preload="auto"></audio>
    <!-- start alert -->
    <div id="alert" class="alert ">
      <div class="pop">
        <h2>Congratulations</h2>
        <h3>You Wine!</h3>
        <p>Do You Want To Play Again?</p>
        <button class="replay" onclick="replaygame()">Replay</button>
        <button class="cancel" onclick="cancel()">cancel</button>
      </div>
    </div>
    <!-- start cancel -->
    <div class="canceling none" onclick="removepopUp()">
      <div class="pop">
        <h1>The End</h1>
        <h3 class="words">Thank You For Playing This Game.</h3>
        <p>And See You Again.</p>
      </div>
    </div>
    <!-- end cancel -->
    <!-- end alert -->
    <script src="JS/main.js"></script>
  </body>
</html>
